name: 同步 OSS 到 Obsidian 仓库

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-from-oss:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 1️⃣ 下载最新版 ossutil (1.7.13)
      - name: 安装 ossutil
        run: |
          curl -o ossutil64 http://gosspublic.alicdn.com/ossutil/1.7.13/ossutil64
          chmod +x ossutil64

      # 2️⃣ 配置并检查 Secrets
      - name: 配置 ossutil
        run: |
          # 检查 Secret 是否真的读取到了
          if [ -z "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then
            echo "❌ 错误: 没读到 OSS_ACCESS_KEY_ID，请检查 GitHub Settings -> Secrets"
            exit 1
          fi
          # 配置命令
          ./ossutil64 config -e oss-cn-shanghai.aliyuncs.com -i ${{ secrets.OSS_ACCESS_KEY_ID }} -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} -L CH

      # 3️⃣ 执行同步
      - name: 拉取 OSS 文件到 content/
        run: |
          mkdir -p content
          # 使用当前目录下的 ./ossutil64 确保版本正确
          # sync 命令会将云端 0.数字花园 目录的内容同步到本地 content 目录
          ./ossutil64 sync oss://${{ secrets.OSS_BUCKET }}/0.数字花园/ content/ --delete
          
          # 确保 .gitkeep 存在
          touch content/.gitkeep
          echo "OSS 同步完成 ✅"

      # 4️⃣ 提交并推送
      - name: Commit & push if changed
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name  "OSS Sync Bot"
          git config user.email "bot@users.noreply.github.com"

          if [[ -n $(git status --porcelain) ]]; then
            git add -A
            git commit -m "chore: sync notes from OSS $(date '+%Y-%m-%d %H:%M:%S')"
            git push
            echo "已检测到变动并推送 🚀"
          else
            echo "没有文件变化，跳过提交 ✔"
          fi
