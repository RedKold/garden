name: 同步 OSS 到 Obsidian 仓库

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-from-oss:
    runs-on: ubuntu-latest
    # 1️⃣ 必须添加权限声明
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 ossutil
        run: |
          curl -o ossutil64 http://gosspublic.alicdn.com/ossutil/1.7.13/ossutil64
          chmod +x ossutil64

      - name: 配置 ossutil
        run: |
          if [ -z "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then
            echo "❌ 错误: 没读到 OSS_ACCESS_KEY_ID"
            exit 1
          fi
          ./ossutil64 config -e oss-cn-shanghai.aliyuncs.com -i ${{ secrets.OSS_ACCESS_KEY_ID }} -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} -L CH

      - name: 拉取 OSS 文件到 content/
        run: |
          mkdir -p content
          mkdir -p /tmp/oss_backup
          # 同步根目录内容到 content/
          ./ossutil64 sync oss://${{ secrets.OSS_BUCKET }}/ content/ --delete --backup-dir /tmp/oss_backup
          
          # 2️⃣ 注意：清理一下生成的二进制文件，避免被提交到仓库
          rm -f ossutil64
          touch content/.gitkeep
          echo "OSS 同步完成 ✅"

      - name: Commit & push if changed
        env:
          TZ: Asia/Shanghai
        run: |
          git config user.name  "OSS Sync Bot"
          git config user.email "bot@users.noreply.github.com"

          if [[ -n $(git status --porcelain) ]]; then
            git add -A
            git commit -m "chore: sync notes from OSS $(date '+%Y-%m-%d %H:%M:%S')"
            git push
            echo "已检测到变动并推送 🚀"
          else
            echo "没有文件变化，跳过提交 ✔"
          fi
